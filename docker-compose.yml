services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: enterprisehub
      MYSQL_USER: enterprisehub
      MYSQL_PASSWORD: enterprisehub
      MYSQL_ROOT_PASSWORD: localroot
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uenterprisehub"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
